<!DOCTYPE html>
<html lang="en">
<head>
<title> Continental Hotel Reservation Form </title>
<style>
body{
background-color:white;
font-family: Arial, sans-serif;
}
.container{
width:550px;
margin:auto;
padding:10px;
background-color:lightgray;
}
h1{
color:red;
text-align:center;
font-size:22px;
font-family: Verdana, sans-serif;
}
table{
width:100%;
border: 3px double black;
background-color:lightblue;
}
td{
border:2px inset gray;
padding:6px;
}
.label-text{
font-weight:bold;
text-align:right;
width:150px;
}
input, select{
font-family: Arial, sans-serif;
}
.center{
text-align:center;
}
</style>
</head>
<body>
<div class="container">
<h1>Continental Hotel Reservation Form</h1>
<form action="/action_page.php">
<table>
<tr>
<td class="label-text">Name</td>
<td><input type="text" name="name" placeholder="Enter your name"></td>
</tr>
<tr>
<td class="label-text">eMail</td>
<td><input type="email" name="email" value="info@continental.pk"></td>
</tr>
<tr>
<td class="label-text">Mobile No</td>
<td><input type="text" name="mobile" placeholder="Enter your cell number"></td>
</tr>
<tr>
<td class="label-text">Arrival Time</td>
<td><input type="text" name="arrival" placeholder="Enter your arrival time"></td>
</tr>
<tr>
<td class="label-text">Departure</td>
<td>
<input type="text" name="departure1">
<input type="text" name="departure2">
</td>
</tr>
<tr>
<td class="label-text">Room Type</td>
<td>
<input type="radio" name="room1" value="single"> Single
<input type="radio" name="room2" value="double"> Double <br>
<input type="radio" name="room3" value="suite"> Presidential Suite
</td>
</tr>
<tr>
<td class="label-text">Preferences</td>
<td>
<input type="checkbox" name="preference1"> Non-Smoking <br>
<input type="checkbox" name="preference2"> Internet <br>
<input type="checkbox" name="preference3"> Firm Mattress <br>
</td>
</tr>
<tr>
<td class="label-text">Mode of Payment</td>
<td>
<input type="checkbox" name="mode1"> Cash
<input type="checkbox" name="mode2"> Check <br>
<input type="checkbox" name="mode3"> Credit Card
<select name="card">
<option>Select Card</option>
<option>Visa</option>
<option>Master Card</option>
</select>
</td>
</tr>
<tr>
<td colspan="2" class="center">
<input type="submit" value="Send Data">
</td>
</tr>
</table>
</form>
</div>
</body>
</html>
